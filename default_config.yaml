# FoveaEdge default configuration
# All subsystem parameters in one place.

device:
  device: CPU
  performance_hint: LATENCY
  streams: 0
  enable_gpu: true

capture:
  source: "0"
  width: 1920
  height: 1080
  fps: 30.0
  max_frames: 0
  shutdown_timeout: 5.0

peripheral:
  bg_history: 500
  bg_threshold: 500
  min_motion_area_ratio: 0.001
  blur_kernel: 21
  dilate_iterations: 3
  morph_kernel: 5

roi:
  roi_width: 640
  roi_height: 640
  roi_padding: 32
  min_roi_size: 32
  max_rois: 8
  min_score: 0.1
  merge_iou_threshold: 0.4
  max_roi_area_ratio: 0.5

scheduler:
  max_inferences_per_frame: 4
  target_frame_latency_ms: 33.0
  roi_reinfer_interval: 5
  min_reinfer_interval_ms: 100.0
  weight_motion: 0.4
  weight_persistence: 0.2
  weight_novelty: 0.2
  weight_area_penalty: 0.1
  weight_overlap_penalty: 0.1

inference:
  model_path: ssd_mobilenet_v2/SSD-MobileNetV2.xml
  confidence_threshold: 0.5
  use_async: true
  async_queue_depth: 4
  input_width: 300
  input_height: 300
  mean: [0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0]

tracking:
  enable_temporal_reuse: true
  max_track_age: 10
  confidence_decay: 0.9
  reinfer_confidence_threshold: 0.3

telemetry:
  enabled: true
  window_size: 30
  report_interval: 5.0
  output_dir: docs/progress
